# 第一阶段媒体服务器配置。
# RTMP -> HLS 是当前手机 A / 手机 B MVP 的主链路；RTC 配置为后续 WebRTC 预留。
listen              1935;
max_connections     1000;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       $SRS_CANDIDATE;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      6;
    }

    rtc {
        enabled         on;
        # 当前 MVP 只走 RTMP -> HLS。
        # 关闭 RTMP/RTC 桥接，避免 SRS 为了 WebRTC 转码/重采样而干扰
        # Android RootEncoder 推送的 AAC 音频；后续接入 WebRTC 时再单独开启。
        rtmp_to_rtc     off;
        rtc_to_rtmp     off;
    }
}
